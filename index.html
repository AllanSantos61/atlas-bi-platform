<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas BI | Demo</title><style>:root{--bg:#091120;--panel:#121f33;--border:#2c4058;--text:#e9f2ff;--muted:#9bb0c9;--mint:#61e2c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--mint)}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{padding:28px 17px;border-right:1px solid var(--border);background:#0c1728}.brand{font-size:25px;font-weight:800;margin:0 12px 35px}.brand b{color:var(--mint)}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#b5c7db;padding:13px 16px;border-radius:10px;margin:5px 0}.nav.active,.nav:hover{background:#1a3047;color:var(--mint)}main{padding:38px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.badge{color:var(--mint);font-size:12px;font-weight:800;letter-spacing:2px}h1{font-size:34px;margin:7px 0 5px}h2{font-size:21px}.muted{color:var(--muted)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}select,input{background:#132238;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:11px;min-width:140px}.btn{background:var(--mint);color:#06251e;border:0;border-radius:9px;padding:11px 16px;font-weight:800}.btn.alt{background:#21364e;color:var(--text)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:linear-gradient(145deg,#14243a,#101b2d);border:1px solid var(--border);border-radius:15px;padding:22px}.card small{color:var(--muted)}.card strong{display:block;font-size:28px;margin:8px 0}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:17px;margin-top:18px}.bar{background:#243a4f;height:13px;border-radius:12px;overflow:hidden;margin:13px 0}.bar span{display:block;height:100%;background:var(--mint);border-radius:12px}.row{display:flex;justify-content:space-between;gap:15px;margin:13px 0;color:#b9c9d9}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th,.table td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--border)}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}.pill{background:#244b49;color:#a5f4d8;padding:5px 10px;border-radius:30px;font-size:12px}.form{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.form input,.form select{flex:1;min-width:155px}.notice{padding:13px 17px;background:#163a39;border:1px solid #285e58;border-radius:10px;color:#aaf0d7;margin-top:25px}.hidden{display:none}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}aside{border-right:0;padding:15px}.brand{margin:0 0 10px}.menu{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}main{padding:22px}.cards{grid-template-columns:1fr 1fr}.card{padding:15px}.card strong{font-size:22px}}</style></head><body><div class="app"><aside><div class="brand">ATLAS <b>BI</b></div><div class="menu"><button class="nav active" data-tab="visao">◈ Visão executiva</button><button class="nav" data-tab="projetos">▤ Projetos</button><button class="nav" data-tab="tarefas">☑ Tarefas</button><button class="nav" data-tab="clientes">♙ Clientes</button><button class="nav" data-tab="financeiro">▥ Financeiro</button><button class="nav" data-tab="metas">◎ Metas</button></div><p class="muted" style="font-size:12px;margin:28px 12px">DEMO • dados fictícios<br>Sem conexão com empresas reais</p></aside><main><div class="top"><div><div class="badge">BUSINESS INTELLIGENCE / DEMONSTRAÇÃO</div><h1 id="title">Visão executiva</h1><div class="muted">Gestão inteligente, resultados visíveis.</div></div><button class="btn alt" id="reset">Restaurar dados fictícios</button></div><div class="controls"><select id="year"><option value="all">Todos os anos</option><option value="2026" selected>2026</option><option value="2027">2027</option></select><select id="owner"><option value="all">Todos os responsáveis</option></select></div><div id="view"></div><div class="notice">Ambiente demonstrativo: os registros são fictícios e as alterações ficam somente neste navegador.</div></main></div><script src="kpis.js"></script><script>
const initial={meta:1200000,projetos:[{id:1,nome:"Expansão Aurora",cliente:"Aurora Ventures",responsavel:"Marina",ano:2026,status:"Recebido",valor:240000},{id:2,nome:"Projeto Horizonte",cliente:"Horizonte Labs",responsavel:"Rafael",ano:2026,status:"Assinado",valor:180000},{id:3,nome:"Nova Unidade",cliente:"Vértice Group",responsavel:"Marina",ano:2026,status:"Em negociação",valor:320000},{id:4,nome:"Reestruturação",cliente:"Atlas Comércio",responsavel:"Camila",ano:2026,status:"Em andamento",valor:135000},{id:5,nome:"Operação Prisma",cliente:"Prisma Digital",responsavel:"Rafael",ano:2026,status:"Recebido",valor:165000},{id:6,nome:"Projeto Íris",cliente:"Íris Holding",responsavel:"Camila",ano:2027,status:"Em negociação",valor:210000}],tarefas:[{id:1,nome:"Revisar indicadores",responsavel:"Marina",status:"Em andamento"},{id:2,nome:"Validar documentação",responsavel:"Rafael",status:"Pendente"},{id:3,nome:"Concluir apresentação",responsavel:"Camila",status:"Concluída"}],clientes:[{id:1,nome:"Aurora Ventures",setor:"Tecnologia"},{id:2,nome:"Horizonte Labs",setor:"Serviços"},{id:3,nome:"Vértice Group",setor:"Imobiliário"},{id:4,nome:"Atlas Comércio",setor:"Varejo"}]};let state;try{state=JSON.parse(localStorage.getItem("atlas-demo-v1"))||structuredClone(initial)}catch(e){state=structuredClone(initial)}const save=()=>localStorage.setItem("atlas-demo-v1",JSON.stringify(state));const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});const safe=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let tab="visao";const $=s=>document.querySelector(s);const rows=()=>state.projetos.filter(p=>($("#year").value==="all"||String(p.ano)===$("#year").value)&&($("#owner").value==="all"||p.responsavel===$("#owner").value));const card=(t,n)=>'<div class="card"><small>'+t+'</small><strong>'+n+'</strong></div>';const table=(head,data)=>'<div class="panel tablewrap"><table class="table"><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join("")+'</tr></thead><tbody>'+data.join("")+'</tbody></table></div>';const tr=arr=>'<tr>'+arr.map(x=>'<td>'+x+'</td>').join("")+'</tr>';function render(){const p=rows(),metrics=AtlasKPIs.calculate(p,state.meta),received=metrics.received,potential=metrics.potential,signed=metrics.signed;$("#title").textContent=({visao:"Visão executiva",projetos:"Projetos",tarefas:"Tarefas",clientes:"Clientes",financeiro:"Financeiro",metas:"Metas"})[tab];let out="";if(tab==="visao"){out='<div class="cards">'+card("Projetos",p.length)+card("Assinados",signed)+card("Receita potencial",money(potential))+card("Recebido",money(received))+'</div><div class="layout"><div class="panel"><h2>Receita por projeto</h2>'+p.map(x=>'<div class="row"><span>'+safe(x.nome)+'</span><b>'+money(x.valor)+'</b></div><div class="bar"><span style="width:'+Math.min(100,100*x.valor/Math.max(1,...p.map(y=>y.valor)))+'%"></span></div>').join("")+'</div><div class="panel"><h2>Meta anual</h2><strong style="font-size:32px">'+Math.round(received/state.meta*100)+'%</strong><div class="bar"><span style="width:'+Math.min(100,received/state.meta*100)+'%"></span></div><p>'+money(received)+' de '+money(state.meta)+'</p><p>Restante: '+money(Math.max(0,state.meta-received))+'</p></div></div>'}if(tab==="projetos"){out='<form class="form" id="addProject"><input name="nome" placeholder="Nome do projeto" required maxlength="80"><input name="cliente" placeholder="Cliente fictício" required maxlength="80"><input name="responsavel" placeholder="Responsável" required maxlength="50"><input name="valor" type="number" min="0" placeholder="Valor (R$)" required><select name="status"><option>Em andamento</option><option>Em negociação</option><option>Assinado</option><option>Recebido</option><option>Paralisado</option></select><button class="btn">Adicionar projeto</button></form>'+table(["Projeto","Cliente","Responsável","Ano","Status","Valor"],p.map(x=>tr([safe(x.nome),safe(x.cliente),safe(x.responsavel),x.ano,'<span class="pill">'+safe(x.status)+'</span>',money(x.valor)])))}if(tab==="tarefas"){out='<form class="form" id="addTask"><input name="nome" placeholder="Nova tarefa" required maxlength="80"><input name="responsavel" placeholder="Responsável" required maxlength="50"><button class="btn">Adicionar tarefa</button></form>'+table(["Tarefa","Responsável","Status"],state.tarefas.map(x=>tr([safe(x.nome),safe(x.responsavel),'<span class="pill">'+safe(x.status)+'</span>'])))}if(tab==="clientes"){out='<form class="form" id="addClient"><input name="nome" placeholder="Nome fictício" required maxlength="80"><input name="setor" placeholder="Setor" required maxlength="50"><button class="btn">Adicionar cliente</button></form>'+table(["Cliente","Setor"],state.clientes.map(x=>tr([safe(x.nome),safe(x.setor)])))}if(tab==="financeiro"){out='<div class="cards">'+card("Receita potencial",money(potential))+card("Recebido",money(received))+card("A receber",money(p.filter(x=>x.status==="Assinado").reduce((a,b)=>a+b.valor,0)))+card("Projetos",p.length)+'</div><div style="margin-top:18px">'+table(["Projeto","Situação","Valor"],p.map(x=>tr([safe(x.nome),safe(x.status),money(x.valor)])))+'</div>'}if(tab==="metas"){out='<div class="panel"><h2>Meta anual demonstrativa</h2><form id="setGoal" class="form"><input type="number" name="meta" min="1" value="'+state.meta+'" required><button class="btn">Atualizar meta</button></form><h2>'+money(received)+' / '+money(state.meta)+'</h2><div class="bar"><span style="width:'+Math.min(100,received/state.meta*100)+'%"></span></div><p>'+Math.round(received/state.meta*100)+'% atingido · '+money(Math.max(0,state.meta-received))+' restante</p></div>'}$("#view").innerHTML=out}function owners(){let selected=$("#owner").value;$("#owner").innerHTML='<option value="all">Todos os responsáveis</option>'+[...new Set(state.projetos.map(x=>x.responsavel))].map(x=>'<option value="'+safe(x)+'">'+safe(x)+'</option>').join("");$("#owner").value=[...$("#owner").options].some(x=>x.value===selected)?selected:"all"}document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x===b));render()});$("#year").onchange=render;$("#owner").onchange=render;$("#reset").onclick=()=>{if(confirm("Restaurar os dados fictícios originais?")){state=structuredClone(initial);save();owners();render()}};document.addEventListener("submit",e=>{if(!["addProject","addTask","addClient","setGoal"].includes(e.target.id))return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(e.target.id==="addProject"){state.projetos.push({id:Date.now(),nome:d.nome,cliente:d.cliente,responsavel:d.responsavel,ano:Number($("#year").value==="all"?2026:$("#year").value),status:d.status,valor:Number(d.valor)});owners()}if(e.target.id==="addTask")state.tarefas.push({id:Date.now(),nome:d.nome,responsavel:d.responsavel,status:"Pendente"});if(e.target.id==="addClient")state.clientes.push({id:Date.now(),nome:d.nome,setor:d.setor});if(e.target.id==="setGoal")state.meta=Number(d.meta);save();render()});owners();render();
</script><script src="enhancements.js" defer></script></body></html>
